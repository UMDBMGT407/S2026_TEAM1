<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./CSS/style-man-dash.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="manager-page-6-0-dashboard-analytics">

    <img class="kft-logo" src="Images/kft-logo0.png" alt="Kung Fu Tea Silver Spring logo" />

    <div class="rectangle-5"></div>
    <div class="rectangle-7"></div>
    <div class="dashboard-analytics">Dashboard &amp; Analytics</div>

    <div class="rectangle-11">
      <div class="restock-alerts" style="left: 24px; top: 25px;">Restock Alerts</div>

      <div class="inventory-controls-row" style="left: 24px; top: 65px;">
        <div class="time-box">As of: 3/5/26 13:12</div>
        
        <select class="dropdown-box">
          <option value="all">Category: All</option>
          <option value="toppings">Toppings</option>
          <option value="syrups">Syrups</option>
          <option value="tea">Tea</option>
          <option value="dairy">Dairy</option>
        </select>
        
        <button type="button" class="refresh-btn">Refresh ↻</button>
      </div>

      <div class="table-card-bg">
        <div class="table-container">
          <div class="table-header">
            <div class="col-ingredient">Ingredient</div>
            <div class="col-status">Status</div>
          </div>
          <div class="table-divider"></div>
          <div class="table-body">
            <div class="table-row"><div class="col-ingredient">Tapioca Pearls</div><div class="col-status critical">Critical</div></div>
            <div class="table-row"><div class="col-ingredient">Mango Syrup</div><div class="col-status critical">Critical</div></div>
            <div class="table-row"><div class="col-ingredient">Black Tea</div><div class="col-status low">Low</div></div>
          </div>
        </div>
      </div>
    </div>

    <img class="kpi-dashboard-1" src="Images/kpi-dashboard-10.png" />
    <div class="rectangle-26"></div>
    <img class="kpi-dashboard-2" src="Images/kpi-dashboard-20.png" />

    <div class="usage-trends">Usage Trends</div>
    <div class="usage-controls-row">
      <select class="dropdown-box" aria-label="Usage Start Date">
        <option value="today">Start: Today</option>
        <option value="24h">Start: 24h Ago</option>
        <option value="2026-03-09">Start: Mon 3/9</option>
        <option value="2026-03-02" selected>Start: Mon 3/2</option>
        <option value="custom">Start: Custom Date</option>
      </select>
      
      <select class="dropdown-box" aria-label="Usage End Date">
        <option value="now">End: Now (Live)</option>
        <option value="yesterday">End: Yesterday</option>
        <option value="2026-03-13">End: Fri 3/13</option>
        <option value="2026-03-06">End: Fri 3/6</option>
      </select>
    
      <select class="dropdown-box" aria-label="Ingredient Category">
        <option value="all">Category: All</option>
        <option value="toppings">Toppings</option>
        <option value="syrups">Syrups</option>
        <option value="tea">Tea</option>
        <option value="dairy">Dairy</option>
      </select>
    </div>

    <!-- For the boxes in the "Current Inventory" chunk -->
    <div class="rectangle-22">
      <div class="current-inventory" style="left: 24px; top: 25px;">Current Inventory</div>
      <div class="inventory-controls-row" style="left: 24px; top: 65px;">
        <div class="time-box">As of: 3/5/26 13:12</div>
        
        <select class="dropdown-box">
          <option value="all">Category: All</option>
          <option value="toppings">Toppings</option>
          <option value="syrups">Syrups</option>
          <option value="tea">Tea</option>
          <option value="dairy">Dairy</option>
        </select>
        
        <button type="button" class="refresh-btn">Refresh ↻</button>
      </div>

      <div class="table-card-bg">
        <div class="table-container">
          <div class="table-header">
            <div class="col-ingredient">Ingredient</div>
            <div class="col-qty">System Qty</div>
          </div>
          <div class="table-divider"></div>
          <div class="table-body">
            <div class="table-row"><div class="col-ingredient">Tapioca Pearls</div><div class="col-qty">10</div></div>
            <div class="table-row"><div class="col-ingredient">Black Tea</div><div class="col-qty">6</div></div>
            <div class="table-row"><div class="col-ingredient">Mango Syrup</div><div class="col-qty">5</div></div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Audit Discrepancy Patterns chunk -->
    <div class="audit-discrepancy-patterns">Audit Discrepancy Patterns</div>
    <div class="discrepancy-controls-row">

      <select class="dropdown-box" aria-label="Start Month">
        <option value="" disabled selected>Start Month</option>
        <option value="2026-01">Jan '26</option>
        <option value="2026-02">Feb '26</option>
        <option value="2026-03">Mar '26</option>
        <option value="2025-12">Dec '25</option>
      </select>
      
      <select class="dropdown-box" aria-label="End Month">
        <option value="" disabled selected>End Month</option>
        <option value="2026-03">Mar '26</option>
        <option value="2026-04">Apr '26</option>
        <option value="2026-05">May '26</option>
        <option value="2026-06">Jun '26</option>
      </select>

      <select class="dropdown-box" style="width: 150px;" aria-label="Analysis View">
        <option value="accuracy">View: Accuracy %</option>
        <option value="volume">View: Volume Loss</option>
        <option value="financial">View: Financial Impact ($)</option>
        <option value="shift">View: Shift Comparison</option>
      </select>
    
      <select class="dropdown-box" aria-label="Category Filter">
        <option value="all">Category: All</option>
        <option value="toppings">Toppings</option>
        <option value="syrups">Syrups</option>
        <option value="tea">Tea</option>
        <option value="dairy">Dairy</option>
      </select>
    
    </div>
  
    <img class="main-rectangle" src="Images/main-rectangle0.svg" />
    <div class="frame-152"></div>
    <div class="frame-9">
      <div class="ingredient">Ingredient</div>
      <div class="system-qty">System Qty</div>
    </div>
    <img class="rectangle-1" src="Images/rectangle-10.svg" />
    <div class="rectangle-8"></div>

  <div class="sidebar-nav">
    <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/FULL/MAN-FULL/man-full.html'">Full Inventory View</button>
    <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/audit/MAN-AUDIT-1/man-audit-1.html'">Inventory Reconciliation</button>
    <button class="nav-btn" onclick="window.location.href='../MAN-AUDIT-4/man-audit-4.html'">Activity Log</button>
    <button class="nav-btn active">Dashboards &amp; Analytics</button>
    <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/predictive/MAN-PREDICTIVE-7/man-predictive-7.html'">Predictive Reports</button>
    <button class="nav-btn" onclick="window.location.href='../../manage-users/MAN-AUDIT-5/user1.html'">Manage Users</button>
    <button class="nav-btn two-line" onclick="window.location.href='/S2026_TEAM1/Purchase%20Order%20Management/purchase_order_info.html'>Purchase Order<br>Management</button>
  </div>

  <a href="#" class="logout-btn">Logout</a>
</div>
  
</body>
</html>
