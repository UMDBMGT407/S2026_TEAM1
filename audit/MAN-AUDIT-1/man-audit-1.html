<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../CSS/style-man1.css">

  <title>Inventory Reconciliation</title>
</head>

<body>

<div class="container-fluid p-0">

  <!-- SIDEBAR -->
  <nav class="sidebar-wrapper">

    <div class="sidebar-top">

      <img class="kft-logo" src="kft-logo0.png" alt="logo">

      <div class="sidebar-nav">

        <button class="nav-btn">Full Inventory View</button>
        <button class="nav-btn active">Inventory Reconciliation</button>
        <button class="nav-btn">Activity Log</button>
        <button class="nav-btn">Dashboards & Analytics</button>
        <button class="nav-btn">Predictive Reports</button>
        <button class="nav-btn">Manage Users</button>
        <button class="nav-btn two-line">Purchase Order<br>Management</button>

      </div>

    </div>

    <div class="sidebar-bottom">
      <a href="#" class="logout-btn">Logout</a>
    </div>

  </nav>

  <!-- MAIN -->
  <main class="main-content-area">

    <div class="content-container-centered">

      <div class="rectangle-5 mb-5">
        <h1 class="page-title">Inventory Reconciliation</h1>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-10">

          <div class="dashboard-card p-4">

            <div class="mb-4">
              <h2 class="section-title">Last Audit: March 5, 2026</h2>
              <hr>
              <p class="section-sub">Conducted by: Sophie M.</p>
            </div>

            <div class="mb-4">
              <h2 class="section-title">Audit to Approve: March 5, 2026</h2>
              <hr>
              <p class="section-sub">Conducted by: Sophie M.</p>
            </div>

            <div class="d-flex justify-content-end">
              <button class="approve-btn">Approve Audit</button>
            </div>

          </div>

          <div class="row mt-4 g-3">
            <div class="col-md-6">
              <button class="resume-btn w-100">Resume Draft Audit</button>
            </div>
            <div class="col-md-6">
              <button class="start-btn w-100">Start New Audit</button>
            </div>
          </div>

        </div>
      </div>

    </div>

  </main>

</div>

</body>
</html>
