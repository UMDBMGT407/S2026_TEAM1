<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Reconciliation - Audit Report Summary</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/style-man3.css">
</head>
<body>

<div class="container-fluid p-0">

  <!-- SIDEBAR -->
  <nav class="sidebar-wrapper d-flex flex-column justify-content-between align-items-center">
    <div class="w-100">
      <img class="kft-logo" src="kft-logo0.png" alt="Kung Fu Tea logo">

      <div class="sidebar-nav d-flex flex-column gap-2">
        <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/FULL/MAN-FULL/man-full.html'">
          Full Inventory View
        </button>

        <button class="nav-btn active">
          Inventory Reconciliation
        </button>

        <button class="nav-btn" onclick="window.location.href='../MAN-AUDIT-4/man-audit-4.html'">
          Activity Log
        </button>

        <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/manager-dashboard/man-dash.html'">
          Dashboards & Analytics
        </button>

        <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/predictive/MAN-PREDICTIVE-7/man-predictive-7.html'">
          Predictive Reports
        </button>

        <button class="nav-btn" onclick="window.location.href='../../manage-users/MAN-AUDIT-5/user1.html'">
          Manage Users
        </button>

        <button class="nav-btn two-line" onclick="window.location.href='/S2026_TEAM1/Purchase%20Order%20Management/purchase_order_info.html'">
          Purchase Order<br>Management
        </button>
      </div>
    </div>

    <div class="logout-wrap">
      <a href="/S2026_TEAM1/index.html" class="logout-btn">Logout</a>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main-content-area">
    <div class="content-container-centered">

      <!-- HEADER -->
      <div class="rectangle-5">
        <h1 class="page-title">Inventory Reconciliation - Audit Report Summary</h1>
      </div>

      <!-- SUMMARY CARD -->
      <div class="summary-card">
        <div class="summary-header">Audit Date: March 6, 2026</div>

        <div class="summary-row">
          <span>Conducted by: Evelyn A.</span>
        </div>

        <div class="summary-row">
          <span>Total Items Checked: 3</span>
        </div>

        <div class="summary-row">
          <span>Discrepancies Found :</span>
          <span class="red-text">2</span>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-card">
        <div class="table-header">
          <div class="ingredient-col">Ingredient</div>
          <div class="qty-col">System Qty</div>
          <div class="count-col">Physical Count</div>
          <div class="diff-col">Difference</div>
        </div>

        <div class="table-row">
          <div class="ingredient-col">Tapioca Pearls</div>
          <div class="qty-col">10</div>
          <div class="count-col"><div class="count-pill">10</div></div>
          <div class="diff-col">0</div>
        </div>

        <div class="table-row">
          <div class="ingredient-col">Mango Syrup</div>
          <div class="qty-col">5</div>
          <div class="count-col"><div class="count-pill">1</div></div>
          <div class="diff-col red-text">4</div>
        </div>

        <div class="table-row">
          <div class="ingredient-col">Large Cups</div>
          <div class="qty-col">20</div>
          <div class="count-col"><div class="count-pill">21</div></div>
          <div class="diff-col red-text">-1</div>
        </div>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="frame-actions">
        <button class="export-btn" onclick="window.print()">Export Report</button>
        <button class="close-btn" onclick="window.location.href='../MAN-AUDIT-1/man-audit-1.html'">Approve and Close</button>
      </div>

    </div>
  </main>

</div>

</body>
</html>
