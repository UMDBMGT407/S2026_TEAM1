<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Reconciliation - Audit Report Summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/style-man3.css">
</head>
<body>
  <div class="manager-page d-flex">

    <!-- SIDEBAR -->
    <nav class="sidebar d-flex flex-column">
      <div>
        <img src="kft-logo0.png" alt="Kung Fu Tea logo" class="logo mb-3">
        <div class="sidebar-nav d-flex flex-column">
          <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/FULL/MAN-FULL/man-full.html'">Full Inventory View</button>
          <button class="nav-btn active">Inventory Reconciliation</button>
          <button class="nav-btn" onclick="window.location.href='../MAN-AUDIT-4/man-audit-4.html'">Activity Log</button>
          <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/manager-dashboard/man-dash.html'">Dashboards & Analytics</button>
          <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/predictive/MAN-PREDICTIVE-7/man-predictive-7.html'">Predictive Reports</button>
          <button class="nav-btn" onclick="window.location.href='../../manage-users/MAN-AUDIT-5/user1.html'">Manage Users</button>
          <button class="nav-btn two-line" onclick="window.location.href='/S2026_TEAM1/Purchase%20Order%20Management/purchase_order_info.html'">Purchase Order<br>Management</button>
        </div>
      </div>
      <a href="/S2026_TEAM1/index.html" class="logout-btn">Logout</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content flex-grow-1">

      <!-- Header -->
      <div class="header-card">
        <h1>Inventory Reconciliation - Audit Report Summary</h1>
      </div>

      <!-- Summary Card -->
      <div class="summary-card">
        <div class="summary-header">Audit Date: March 6, 2026</div>
        <div class="summary-row">Conducted by: Evelyn A.</div>
        <div class="summary-row">Total Items Checked: 3</div>
        <div class="summary-row">Discrepancies Found: <span class="red-text">2</span></div>
      </div>

      <!-- Table Card -->
      <div class="table-card table-responsive">
        <table class="table table-borderless mb-0">
          <thead class="table-header">
            <tr>
              <th class="ingredient-col">Ingredient</th>
              <th class="qty-col text-center">System Qty</th>
              <th class="count-col text-center">Physical Count</th>
              <th class="diff-col text-center">Difference</th>
            </tr>
          </thead>
          <tbody class="table-body">
            <tr class="table-row">
              <td class="ingredient-col">Tapioca Pearls</td>
              <td class="qty-col text-center">10</td>
              <td class="count-col text-center"><div class="count-pill">10</div></td>
              <td class="diff-col text-center">0</td>
            </tr>
            <tr class="table-row">
              <td class="ingredient-col">Mango Syrup</td>
              <td class="qty-col text-center">5</td>
              <td class="count-col text-center"><div class="count-pill">1</div></td>
              <td class="diff-col text-center red-text">4</td>
            </tr>
            <tr class="table-row">
              <td class="ingredient-col">Large Cups</td>
              <td class="qty-col text-center">20</td>
              <td class="count-col text-center"><div class="count-pill">21</div></td>
              <td class="diff-col text-center red-text">-1</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Action Buttons -->
      <div class="frame-actions mt-4">
        <button class="export-btn" onclick="window.print()">Export Report</button>
        <button class="close-btn" onclick="window.location.href='../MAN-AUDIT-1/man-audit-1.html'">Approve and Close</button>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
