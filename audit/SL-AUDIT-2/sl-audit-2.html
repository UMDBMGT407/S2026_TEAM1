<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Audit - Physical Count</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/style-sl2.css">
</head>
<body>

<div class="container-fluid p-0">

  <!-- SIDEBAR (FIXED VERSION) -->
  <nav class="sidebar-wrapper d-flex flex-column justify-content-between align-items-center">

    <div class="w-100">
      <img class="kft-logo" src="kft-logo0.png" alt="Kung Fu Tea Silver Spring logo">

      <div class="sidebar-nav d-flex flex-column gap-2">
        <button class="nav-btn"
          onclick="window.location.href='/S2026_TEAM1/FULL/SL-FULL/sl-full.html'">
          Full Inventory View
        </button>

        <button class="nav-btn active">
          Inventory Audit
        </button>
      </div>
    </div>

    <div class="pb-4">
      <a href="/S2026_TEAM1/index.html" class="logout-btn">Logout</a>
    </div>

  </nav>

  <!-- MAIN -->
  <main class="col main-content-area">
    <div class="content-container-centered">

      <!-- HEADER -->
      <div class="rectangle-5 mb-5">
        <h1 class="page-title">Inventory Audit - Physical Count</h1>
      </div>

      <!-- FILTER -->
      <div class="mb-4">
        <select class="category-filter">
          <option>Category: All</option>
          <option>Category: Powder</option>
          <option>Category: Syrup</option>
        </select>
      </div>

      <!-- TABLE -->
      <div class="table-card p-4">

        <div class="table-header">
          <div class="col-ingredient">Ingredient</div>
          <div class="col-center">System Qty</div>
          <div class="col-center">Physical Count</div>
          <div class="col-center">Difference</div>
        </div>

        <div class="table-row">
          <div class="col-ingredient">Tapioca Pearls</div>
          <div class="col-center">10</div>
          <div class="col-center">
            <input class="count-input" value="10">
          </div>
          <div class="col-center">0</div>
        </div>

        <div class="table-row">
          <div class="col-ingredient">Black Tea</div>
          <div class="col-center">6</div>
          <div class="col-center">
            <input class="count-input" value="3">
          </div>
          <div class="col-center text-danger">3</div>
        </div>

        <div class="table-row">
          <div class="col-ingredient">Mango Syrup</div>
          <div class="col-center">5</div>
          <div class="col-center">
            <input class="count-input" value="3">
          </div>
          <div class="col-center text-danger">2</div>
        </div>

        <div class="table-row">
          <div class="col-ingredient">Large Cups</div>
          <div class="col-center">20</div>
          <div class="col-center">
            <input class="count-input" value="21">
          </div>
          <div class="col-center text-danger">-1</div>
        </div>

      </div>

      <!-- BUTTONS -->
      <div class="d-flex justify-content-end gap-3 mt-4 flex-wrap">
        <button class="resume-btn"
          onclick="window.location.href='../SL-AUDIT-1/sl-audit-1.html'">
          Save Draft
        </button>

        <button class="start-btn"
          onclick="window.location.href='../SL-AUDIT-3/sl-audit-3.html'">
          Submit Audit
        </button>
      </div>

    </div>
  </main>

</div>

</body>
</html>
