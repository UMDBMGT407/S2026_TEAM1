<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="../CSS/style-sl2.css">

  <style>
    a,
    button,
    input,
    select,
    h1,
    h2,
    h3,
    h4,
    h5,
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      text-decoration: none;
      background: none;
      -webkit-font-smoothing: antialiased;
    }

    menu, ol, ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
  </style>

  <title>Inventory Audit - Physical Count</title>
</head>
<body>
  <div class="shift-lead-fourth-1-2-page-audit-physical-count">
    <div class="rectangle-5"></div>
    <div class="inventory-audit-physical-count">
      Inventory Audit - Physical Count
    </div>

    <select class="category-filter" aria-label="Category filter">
      <option value="all" selected>Category: All</option>
      <option value="powder">Category: Powder</option>
      <option value="syrup">Category: Syrup</option>
    </select>

    <img class="rectangle-1" src="rectangle-10.svg" alt="" />
    <img class="kft-logo" src="kft-logo0.png" alt="Kung Fu Tea Silver Spring logo" />

    <div class="sidebar-nav">
      <button class="nav-btn">Full Inventory View</button>
      <button class="nav-btn active">Inventory Audit</button>
    </div>

    <a href="../LOGIN/login.html" class="logout-btn">Logout</a>

    <img class="main-rectangle" src="main-rectangle0.svg" alt="" />
    <div class="line-8"></div>

    <div class="frame-9">
      <div class="ingredient">Ingredient</div>
      <div class="system-qty">System Qty</div>
      <div class="physical-count">Physical Count</div>
      <div class="difference">Difference</div>
    </div>

    <div class="frame-15">
      <div class="frame-14">
        <div class="tapioca-pearls">Tapioca Pearls</div>
        <div class="black-tea">Black Tea</div>
        <div class="mango-syrup">Mango Syrup</div>
        <div class="large-cups">Large cups</div>
      </div>

      <div class="frame-13">
        <div class="_10">10</div>
        <div class="_6">6</div>
        <div class="_5">5</div>
        <div class="_20">20</div>
      </div>

      <div class="frame-11">
        <input class="count-input" type="text" value="10" aria-label="Physical count Tapioca Pearls">
        <input class="count-input" type="text" value="3" aria-label="Physical count Black Tea">
        <input class="count-input" type="text" value="3" aria-label="Physical count Mango Syrup">
        <input class="count-input" type="text" value="21" aria-label="Physical count Large cups">
      </div>

      <div class="frame-152">
        <div class="_0">0</div>
        <div class="_33">3</div>
        <div class="_2">2</div>
        <div class="_1">-1</div>
      </div>
    </div>

    <div class="frame-actions">
      <button class="save-btn"
        onclick="window.location.href='../SL-AUDIT-1/sl-audit-1.html'">
        Save Draft
      </button>

      <button class="submit-btn"
        onclick="window.location.href='../SL-AUDIT-3/sl-audit-3.html'">
        Submit Audit
      </button>
    </div>
  </div>
</body>
</html>
