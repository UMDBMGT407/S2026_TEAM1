<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Audit Summary Report</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/style-sl3.css">
</head>

<body>

<div class="container-fluid p-0">

  <!-- SIDEBAR -->
  <nav class="sidebar-wrapper d-flex flex-column justify-content-between">

    <div class="sidebar-top">
      <img class="kft-logo" src="kft-logo0.png" alt="Kung Fu Tea Silver Spring logo">

      <div class="sidebar-nav">
        <button class="nav-btn"
          onclick="window.location.href='/S2026_TEAM1/FULL/SL-FULL/sl-full.html'">
          Full Inventory View
        </button>

        <button class="nav-btn active">
          Inventory Audit
        </button>
      </div>
    </div>

    <div class="logout-wrap">
      <a href="/S2026_TEAM1/index.html" class="logout-btn">Logout</a>
    </div>

  </nav>

  <!-- MAIN -->
  <main class="main-content-area">

    <div class="content-container">

      <!-- TITLE -->
      <div class="rectangle-5">
        <h1 class="page-title">Inventory Audit Summary Report</h1>
      </div>

      <!-- SUMMARY -->
      <div class="summary-card">
        <div class="summary-header">Audit Date: March 6, 2026</div>

        <div class="summary-row">
          <span>Conducted by:</span>
          <span class="summary-value">Evelyn A.</span>
        </div>

        <div class="summary-row">
          <span>Total Items Checked:</span>
          <span class="summary-value">3</span>
        </div>

        <div class="summary-row">
          <span>Discrepancies Found :</span>
          <span class="summary-value red-text">2</span>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-card">

        <div class="table-header">
          <div class="ingredient-col">Ingredient</div>
          <div class="qty-col">System Qty</div>
          <div class="count-col">Physical Count</div>
          <div class="diff-col">Difference</div>
        </div>

        <div class="table-row">
          <div class="ingredient-col">Tapioca Pearls</div>
          <div class="qty-col">10</div>
          <div class="count-col">
            <div class="count-pill">10</div>
          </div>
          <div class="diff-col">0</div>
        </div>

        <div class="table-row">
          <div class="ingredient-col">Mango Syrup</div>
          <div class="qty-col">5</div>
          <div class="count-col">
            <div class="count-pill">1</div>
          </div>
          <div class="diff-col red-text">4</div>
        </div>

        <div class="table-row">
          <div class="ingredient-col">Large cups</div>
          <div class="qty-col">20</div>
          <div class="count-col">
            <div class="count-pill">21</div>
          </div>
          <div class="diff-col red-text">-1</div>
        </div>

      </div>

      <!-- BUTTONS -->
      <div class="action-buttons">
        <button class="export-btn" onclick="window.print()">Export Report</button>

        <button class="close-btn"
          onclick="window.location.href='../SL-AUDIT-1/sl-audit-1.html'">
          Close Audit
        </button>
      </div>

    </div>

  </main>

</div>

</body>
</html>
