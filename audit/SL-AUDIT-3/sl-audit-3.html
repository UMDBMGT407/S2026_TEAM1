<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Audit Summary Report</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/S2026_TEAM1/manager-dashboard/CSS/style-man-dash.css">
</head>
<body>

<div class="container-fluid p-0">

  <!-- SIDEBAR -->
  <nav class="sidebar-wrapper d-flex flex-column justify-content-between align-items-center">

    <div class="w-100">
      <img class="kft-logo" src="kft-logo0.png" alt="Kung Fu Tea Silver Spring logo">

      <div class="sidebar-nav d-flex flex-column gap-2">
        <button class="nav-btn"
          onclick="window.location.href='/S2026_TEAM1/FULL/SL-FULL/sl-full.html'">
          Full Inventory View
        </button>

        <button class="nav-btn active">
          Inventory Audit
        </button>
      </div>
    </div>

    <div class="pb-4">
      <a href="/S2026_TEAM1/index.html" class="logout-btn">Logout</a>
    </div>

  </nav>

  <!-- MAIN CONTENT -->
  <main class="main-content-area">
    <div class="content-container-centered">

      <div class="rectangle-5">
        <h1 class="page-title">Inventory Audit Summary Report</h1>
      </div>

      <div class="sl3-summary-card">
        <div class="sl3-summary-header">Audit Date: March 6, 2026</div>

        <div class="sl3-summary-row">
          <span>Conducted by:</span>
          <span class="sl3-summary-value">Evelyn A.</span>
        </div>

        <div class="sl3-summary-row">
          <span>Total Items Checked:</span>
          <span class="sl3-summary-value">3</span>
        </div>

        <div class="sl3-summary-row">
          <span>Discrepancies Found :</span>
          <span class="sl3-summary-value red-text">2</span>
        </div>
      </div>

      <div class="sl3-table-card">
        <div class="sl3-table-header">
          <div class="sl3-ingredient-col">Ingredient</div>
          <div class="sl3-qty-col">System Qty</div>
          <div class="sl3-count-col">Physical Count</div>
          <div class="sl3-diff-col">Difference</div>
        </div>

        <div class="sl3-table-row">
          <div class="sl3-ingredient-col">Tapioca Pearls</div>
          <div class="sl3-qty-col">10</div>
          <div class="sl3-count-col">
            <div class="sl3-count-pill">10</div>
          </div>
          <div class="sl3-diff-col">0</div>
        </div>

        <div class="sl3-table-row">
          <div class="sl3-ingredient-col">Mango Syrup</div>
          <div class="sl3-qty-col">5</div>
          <div class="sl3-count-col">
            <div class="sl3-count-pill">1</div>
          </div>
          <div class="sl3-diff-col red-text">4</div>
        </div>

        <div class="sl3-table-row">
          <div class="sl3-ingredient-col">Large cups</div>
          <div class="sl3-qty-col">20</div>
          <div class="sl3-count-col">
            <div class="sl3-count-pill">21</div>
          </div>
          <div class="sl3-diff-col red-text">-1</div>
        </div>
      </div>

      <div class="sl3-action-buttons">
        <button class="sl3-export-btn" onclick="window.print()">Export Report</button>

        <button class="sl3-close-btn"
          onclick="window.location.href='../SL-AUDIT-1/sl-audit-1.html'">
          Close Audit
        </button>
      </div>

    </div>
  </main>

</div>

</body>
</html>
