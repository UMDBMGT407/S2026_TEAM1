<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="../CSS/style-man2.css">

  <style>
    a,
    button,
    input,
    select,
    h1,
    h2,
    h3,
    h4,
    h5,
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      text-decoration: none;
      background: none;
      -webkit-font-smoothing: antialiased;
    }

    menu, ol, ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
  </style>
  <title>Inventory Reconciliation - Physical Count</title>
</head>
<body>
  <div class="manager-fourth-1-2-page">
    <div class="rectangle-5"></div>
    <div class="inventory-reconciliation-physical-count">
      Inventory Reconciliation - Physical Count
    </div>

    <select class="category-filter" aria-label="Category filter">
      <option value="all" selected>Category: All</option>
      <option value="powder">Category: Powder</option>
      <option value="syrup">Category: Syrup</option>
    </select>

    <img class="main-rectangle" src="main-rectangle0.svg" alt="" />
    <div class="line-9"></div>

    <div class="frame-20">
      <div class="ingredient">Ingredient</div>
      <div class="system-qty">System Qty</div>
      <div class="physical-count">Physical Count</div>
      <div class="difference">Difference</div>
    </div>

    <div class="frame-19">
      <div class="frame-14">
        <div class="tapioca-pearls">Tapioca Pearls</div>
        <div class="black-tea">Black Tea</div>
        <div class="mango-syrup">Mango Syrup</div>
        <div class="large-cups">Large Cups</div>
      </div>

      <div class="frame-13">
        <div class="_10">10</div>
        <div class="_6">6</div>
        <div class="_5">5</div>
        <div class="_20">20</div>
      </div>

      <div class="frame-11">
        <input class="count-input" type="text" value="10" aria-label="Physical count Tapioca Pearls">
        <input class="count-input" type="text" value="3" aria-label="Physical count Black Tea">
        <input class="count-input" type="text" value="3" aria-label="Physical count Mango Syrup">
        <input class="count-input" type="text" value="21" aria-label="Physical count Large Cups">
      </div>

      <div class="frame-15">
        <div class="_0">0</div>
        <div class="_33">3</div>
        <div class="_2">2</div>
        <div class="_1">-1</div>
      </div>
    </div>

    <div class="frame-actions">
      <button class="save-btn"
        onclick="window.location.href='../MAN-AUDIT-1/man-audit-1.html'">
        Save Draft
      </button>

      <button class="submit-btn"
        onclick="window.location.href='../MAN-AUDIT-3/man-audit-3.html'">
        Submit Audit
      </button>
    </div>

    <img class="rectangle-1" src="rectangle-10.svg" alt="" />
    <img class="kft-logo" src="kft-logo0.png" alt="Kung Fu Tea Silver Spring logo" />

    <div class="sidebar-nav">
      <button class="nav-btn" type="button"
        onclick="window.location.href='/S2026_TEAM1/FULL/MAN-FULL/man-full.html'">
        Full Inventory View
      </button>
      <button class="nav-btn active">Inventory Reconciliation</button>
      <button class="nav-btn"
        onclick="window.location.href='../MAN-AUDIT-4/man-audit-4.html'">
        Activity Log
      </button>
      <button class="nav-btn">Dashboards &amp; Analytics</button>
    <button class="nav-btn"
    onclick="window.location.href='/S2026_TEAM1/predictive/MAN-PREDICTIVE-7/man-predictive-7.html'">
    Predictive Reports
  </button>
      <button class="nav-btn"
  onclick="window.location.href='../../manage-users/MAN-AUDIT-5/user1.html'">
  Manage Users
</button>
      <button class="nav-btn two-line"
  onclick="window.location.href='/S2026_TEAM1/Purchase%20Order%20Management/purchase_order_info.html'">
  Purchase Order<br>Management
</button>
    </div>

    <a href="/S2026_TEAM1/index.html" class="logout-btn">Logout</a>
  </div>
</body>
</html>
