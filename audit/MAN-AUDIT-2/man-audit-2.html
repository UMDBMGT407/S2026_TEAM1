<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Reconciliation - Physical Count</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/style-man2.css">
</head>

<body>

<div class="container-fluid p-0">

  <!-- SIDEBAR -->
  <nav class="sidebar-wrapper d-flex flex-column justify-content-between align-items-center">

    <div class="w-100">
      <img class="kft-logo" src="kft-logo0.png" alt="Kung Fu Tea logo">

      <div class="sidebar-nav d-flex flex-column gap-2">

        <button class="nav-btn"
          onclick="window.location.href='/S2026_TEAM1/FULL/MAN-FULL/man-full.html'">
          Full Inventory View
        </button>

        <button class="nav-btn active">Inventory Reconciliation</button>

        <button class="nav-btn"
          onclick="window.location.href='../MAN-AUDIT-4/man-audit-4.html'">
          Activity Log
        </button>

        <button class="nav-btn"
          onclick="window.location.href='/S2026_TEAM1/manager-dashboard/man-dash.html'">
          Dashboards &amp; Analytics
        </button>

        <button class="nav-btn"
          onclick="window.location.href='/S2026_TEAM1/predictive/MAN-PREDICTIVE-7/man-predictive-7.html'">
          Predictive Reports
        </button>

        <button class="nav-btn"
          onclick="window.location.href='../../manage-users/MAN-AUDIT-5/user1.html'">
          Manage Users
        </button>

        <button class="nav-btn two-line"
          onclick="window.location.href='/S2026_TEAM1/Purchase%20Order%20Management/purchase_order_info.html'">
          Purchase Order<br>Management
        </button>

      </div>
    </div>

    <div class="pb-4">
      <a href="/S2026_TEAM1/index.html" class="logout-btn">Logout</a>
    </div>

  </nav>

  <!-- MAIN CONTENT -->
  <main class="col main-content-area">

    <div class="content-container-centered">

      <!-- HEADER -->
      <div class="rectangle-5 mb-5">
        <h1 class="page-title">Inventory Reconciliation - Physical Count</h1>
      </div>

      <!-- FILTER -->
      <div class="mb-4">
        <select class="category-filter">
          <option>Category: All</option>
          <option>Category: Powder</option>
          <option>Category: Syrup</option>
        </select>
      </div>

      <!-- TABLE CARD -->
      <div class="table-card p-4">

        <div class="table-header d-flex justify-content-between mb-3">
          <div>Ingredient</div>
          <div>System Qty</div>
          <div>Physical Count</div>
          <div>Difference</div>
        </div>

        <!-- ROWS -->
        <div class="table-row d-flex justify-content-between align-items-center mb-3">
          <div>Tapioca Pearls</div>
          <div>10</div>
          <input class="count-input" value="10">
          <div>0</div>
        </div>

        <div class="table-row d-flex justify-content-between align-items-center mb-3">
          <div>Black Tea</div>
          <div>6</div>
          <input class="count-input" value="3">
          <div class="text-danger">3</div>
        </div>

        <div class="table-row d-flex justify-content-between align-items-center mb-3">
          <div>Mango Syrup</div>
          <div>5</div>
          <input class="count-input" value="3">
          <div class="text-danger">2</div>
        </div>

        <div class="table-row d-flex justify-content-between align-items-center">
          <div>Large Cups</div>
          <div>20</div>
          <input class="count-input" value="21">
          <div class="text-danger">-1</div>
        </div>

      </div>

      <!-- BUTTONS -->
      <div class="d-flex justify-content-end gap-3 mt-4">
        <button class="resume-btn"
          onclick="window.location.href='../MAN-AUDIT-1/man-audit-1.html'">
          Save Draft
        </button>

        <button class="start-btn"
          onclick="window.location.href='../MAN-AUDIT-3/man-audit-3.html'">
          Submit Audit
        </button>
      </div>

    </div>

  </main>

</div>

</body>
</html>
