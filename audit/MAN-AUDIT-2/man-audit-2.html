<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Reconciliation - Physical Count</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/S2026_TEAM1/manager-dashboard/CSS/style-man-dash.css">
</head>

<body>

<div class="container-fluid p-0">

  <!-- SIDEBAR -->
  <nav class="sidebar-wrapper d-flex flex-column justify-content-between align-items-center">

    <div class="w-100">
      <img class="kft-logo" src="kft-logo0.png" alt="Kung Fu Tea logo">

      <div class="sidebar-nav d-flex flex-column gap-2">

        <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/FULL/MAN-FULL/man-full.html'">
          Full Inventory View
        </button>
        <button class="nav-btn active">Inventory Reconciliation</button>
        <button class="nav-btn" onclick="window.location.href='../MAN-AUDIT-4/man-audit-4.html'">
          Activity Log
        </button>
        <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/manager-dashboard/man-dash.html'">
          Dashboards & Analytics
        </button>
        <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/predictive/MAN-PREDICTIVE-7/man-predictive-7.html'">
          Predictive Reports
        </button>
        <button class="nav-btn" onclick="window.location.href='../../manage-users/MAN-AUDIT-5/user1.html'">
          Manage Users
        </button>

        <button class="nav-btn two-line"
                onclick="window.location.href='/S2026_TEAM1/Purchase%20Order%20Management/purchase_order_info.html'">
          Purchase Order<br>Management
        </button>

      </div>
    </div>

    <div class="pb-4">
      <a href="/S2026_TEAM1/index.html" class="logout-btn">Logout</a>
    </div>

  </nav>

  <!-- MAIN -->
  <main class="col main-content-area">

    <div class="content-container-centered">

      <!-- HEADER -->
      <div class="rectangle-5 mb-5">
        <h1 class="page-title">Inventory Reconciliation - Physical Count</h1>
      </div>

      <!-- FILTER -->
      <div class="mb-4">
        <select class="man2-category-filter">
          <option>Category: All</option>
          <option>Category: Powder</option>
          <option>Category: Syrup</option>
        </select>
      </div>

      <!-- TABLE -->
      <div class="man2-table-card p-4">

        <!-- HEADER -->
        <div class="man2-table-header">
          <div class="man2-col-ingredient">Ingredient</div>
          <div class="man2-col-center">System Qty</div>
          <div class="man2-col-center">Physical Count</div>
          <div class="man2-col-center">Difference</div>
        </div>

        <!-- ROWS -->
        <div class="man2-table-row">
          <div class="man2-col-ingredient">Tapioca Pearls</div>
          <div class="man2-col-center">10</div>
          <div class="man2-col-center">
            <input class="man2-count-input" value="10">
          </div>
          <div class="man2-col-center">0</div>
        </div>

        <div class="man2-table-row">
          <div class="man2-col-ingredient">Black Tea</div>
          <div class="man2-col-center">6</div>
          <div class="man2-col-center">
            <input class="man2-count-input" value="3">
          </div>
          <div class="man2-col-center text-danger">3</div>
        </div>

        <div class="man2-table-row">
          <div class="man2-col-ingredient">Mango Syrup</div>
          <div class="man2-col-center">5</div>
          <div class="man2-col-center">
            <input class="man2-count-input" value="3">
          </div>
          <div class="man2-col-center text-danger">2</div>
        </div>

        <div class="man2-table-row">
          <div class="man2-col-ingredient">Large Cups</div>
          <div class="man2-col-center">20</div>
          <div class="man2-col-center">
            <input class="man2-count-input" value="21">
          </div>
          <div class="man2-col-center text-danger">-1</div>
        </div>

      </div>

      <!-- BUTTONS -->
      <div class="d-flex justify-content-end gap-3 mt-4">
        <button class="man2-resume-btn" onclick="window.location.href='../MAN-AUDIT-1/man-audit-1.html'">
          Save Draft
        </button>
        <button class="man2-start-btn" onclick="window.location.href='../MAN-AUDIT-3/man-audit-3.html'">
          Submit Audit
        </button>
      </div>

    </div>

  </main>

</div>

</body>
</html>
