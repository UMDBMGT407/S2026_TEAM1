<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/vars.css">
  <link rel="stylesheet" href="/S2026_TEAM1/manager-dashboard/CSS/style-man-dash.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    a,
    button,
    input,
    select,
    h1,
    h2,
    h3,
    h4,
    h5,
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      text-decoration: none;
      -webkit-font-smoothing: antialiased;
    }

    menu, ol, ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
  </style>

  <title>Manage Users</title>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar-wrapper">
    <div>
      <img class="kft-logo" src="../Images/kft-logo0.png" alt="Kung Fu Tea Silver Spring logo">

      <div class="sidebar-nav">
        <button class="nav-btn" type="button"
          onclick="window.location.href='/S2026_TEAM1/FULL/MAN-FULL/man-full.html'">
          Full Inventory View
        </button>

        <button class="nav-btn" type="button"
          onclick="window.location.href='/S2026_TEAM1/audit/MAN-AUDIT-1/man-audit-1.html'">
          Inventory Reconciliation
        </button>

        <button class="nav-btn" type="button"
          onclick="window.location.href='/S2026_TEAM1/audit/MAN-AUDIT-4/man-audit-4.html'">
          Activity Log
        </button>

        <button class="nav-btn" type="button"
          onclick="window.location.href='/S2026_TEAM1/manager-dashboard/man-dash.html'">
          Dashboards &amp; Analytics
        </button>

        <button class="nav-btn" type="button"
          onclick="window.location.href='/S2026_TEAM1/predictive/MAN-PREDICTIVE-7/man-predictive-7.html'">
          Predictive Reports
        </button>

        <button class="nav-btn active" type="button">Manage Users</button>

        <button class="nav-btn two-line" type="button"
          onclick="window.location.href='/S2026_TEAM1/Purchase%20Order%20Management/purchase_order_info.html'">
          Purchase Order<br>Management
        </button>
      </div>
    </div>

    <a href="/S2026_TEAM1/index.html" class="logout-btn">Logout</a>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content-area">
    <div class="content-container-centered">

      <div class="rectangle-5">
        <h1 class="manage-users">Manage Users</h1>
      </div>

      <section class="main-rectangle">
        <div class="manage-users-topbar">
          <h2 class="manage-users2">Manage Users</h2>

          <button class="add-new-user-rectangle add-new-user" id="openPopup" type="button">
            + Add New User
          </button>
        </div>

        <div class="search-row">
          <div class="search-box2">
            <span class="div-span2">⌕</span>
            <input class="fakeSearch" type="text" placeholder="Name">
          </div>
        </div>

        <div class="inner-rec">
          <div class="status-box">
            <div class="frame-2">
              <div class="name2">Name</div>
              <div class="role">Role</div>
              <div class="phone">Phone</div>
              <div class="status">Status</div>
            </div>
          </div>

          <div class="name-1">
            <div class="frame-2">
              <div class="toalima-t">Toalima T</div>
              <div class="manager-role">Manager</div>
              <div class="phone-text">(333)-801-2067</div>
              <div class="active">Active</div>
            </div>
          </div>

          <div class="name-2">
            <div class="frame-2">
              <div class="medhar-p">Medhar P</div>
              <div class="shift-lead">Shift Lead</div>
              <div class="phone-text">(333)-801-2119</div>
              <div class="active">Active</div>
            </div>
          </div>

          <div class="name-3">
            <div class="frame-2">
              <div class="yinmin-l">Yinmin L</div>
              <div class="employee">Employee</div>
              <div class="phone-text">(333)-801-2297</div>
              <div class="active">Active</div>
            </div>
          </div>

          <div class="name-4" id="newUserRow" style="display:none;">
            <div class="frame-2">
              <div id="newName"></div>
              <div id="newRole"></div>
              <div id="newPhone"></div>
              <div id="newStatus"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- POPUP -->
  <div id="popupForm">
    <div class="popup-box">
      <div id="closePopup">✕</div>

      <h4>Add New User</h4>

      <label>Full Name</label>
      <input id="nameInput" placeholder="First, Last Initial">

      <label>Phone Number</label>
      <input id="phoneInput" placeholder="(333)-XXX-XXXX">

      <label>Role</label>
      <select id="roleInput">
        <option>Employee</option>
        <option>Shift Lead</option>
        <option>Manager</option>
      </select>

      <button id="addUser" type="button">Add User</button>
    </div>
  </div>

  <script>
    const popup = document.getElementById("popupForm");
    const openBtn = document.getElementById("openPopup");
    const closeBtn = document.getElementById("closePopup");

    openBtn.onclick = function () {
      popup.style.display = "flex";
    };

    closeBtn.onclick = function () {
      popup.style.display = "none";
    };

    document.getElementById("addUser").onclick = function () {
      const name = document.getElementById("nameInput").value.trim();
      const phone = document.getElementById("phoneInput").value.trim();
      const role = document.getElementById("roleInput").value;

      if (name === "" || phone === "") {
        alert("Please enter name and phone");
        return;
      }

      document.getElementById("newName").innerText = name;
      document.getElementById("newRole").innerText = role;
      document.getElementById("newPhone").innerText = phone;
      document.getElementById("newStatus").innerText = "Active";

      document.getElementById("newUserRow").style.display = "block";
      popup.style.display = "none";

      document.getElementById("nameInput").value = "";
      document.getElementById("phoneInput").value = "";
      document.getElementById("roleInput").value = "Employee";
    };

    window.onclick = function (e) {
      if (e.target === popup) {
        popup.style.display = "none";
      }
    };
  </script>
</body>
</html>
