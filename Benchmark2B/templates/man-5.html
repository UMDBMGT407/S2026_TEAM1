<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- TEAM STYLES -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style-man-dash.css') }}">
  <!-- MY STYLES -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <title>Manage Users</title>
</head>

<body>

<div class="container-fluid p-0">

  <!-- SIDEBAR -->
 <nav class="sidebar-wrapper d-flex flex-column justify-content-between align-items-center">
  <div class="w-100">
    <img class="kft-logo"
      src="{{ url_for('static', filename='images/kft-logo0.png') }}"
      alt="Kung Fu Tea logo"
    />

    <div class="sidebar-nav d-flex flex-column gap-2">
      <button class="nav-btn" type="button"
        onclick="window.location.href='{{ url_for('inventory') }}'">
        Full Inventory View
      </button>

      <button class="nav-btn" type="button"
        onclick="window.location.href='{{ url_for('man_audit_1') }}'">
        Inventory Reconciliation
      </button>

      <button class="nav-btn" type="button"
        onclick="window.location.href='{{ url_for('man_audit_4') }}'">
        Activity Log
      </button>

      <button class="nav-btn" type="button"
        onclick="window.location.href='{{ url_for('dashboard') }}'">
        Dashboards & Analytics
      </button>

      <button class="nav-btn" type="button"
        onclick="window.location.href='{{ url_for('predictive_reports') }}'">
        Predictive Reports
      </button>

      <button class="nav-btn active" type="button"
        onclick="window.location.href='{{ url_for('manage_users') }}'">
        Manage Users
      </button>

      <button class="nav-btn two-line" type="button"
        onclick="window.location.href='{{ url_for('purchaseOrders') }}'">
        Purchase Order<br>Management
      </button>

      <button class="nav-btn" type="button" onclick="window.location.href='{{ url_for('delivery_audit_list') }}'">Delivery Audit</button>
      
    </div>
  </div>

  <div class="pb-4">
    <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
  </div>
</nav>
  
  <!-- ===== MAIN ===== -->
  <main class="col main-content-area">
    <div class="content-container-centered">

      <div class="rectangle-5 mb-5">
        <h1 class="man5-manage-users">Manage Users</h1>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-10">

          <section class="man5-main-rectangle">

            <!-- TOP BAR -->
            <div class="man5-manage-users-topbar">
              <h2 class="man5-manage-users2">Manage Users</h2>

              <div class="man5-add-new-user-rectangle">
                <div class="man5-add-new-user" onclick="openPopup()">+ Add New User</div>
              </div>
            </div>
            
            <!-- SEARCH BAR B2 -->
            <div class="man5-search-row">
              <div class="man5-search-box2">
                <span class="man5-div-span2">🔍</span>
                <input 
                  type="text" 
                  class="man5-fakeSearch" 
                  placeholder="Search users..."
                  onkeyup="filterUsers(this.value)"
                  autocomplete="off"
                >
              </div>
            </div>
            
            <!-- TABLE -->
            <div class="man5-inner-rec">

              <!-- HEADER -->
              <div class="man5-status-box">
                <div class="man5-frame-2">
                  <div class="man5-name2">Name</div>
                  <div class="man5-role">Role</div>
                  <div class="man5-phone">Phone</div>
                  <div class="man5-status">Action</div>
                </div>
              </div>

              <!-- DATA -->
              {% for user in users %}
              <div class="man5-name-1">
                <div class="man5-frame-2">
                  <div>{{ user['name'] }}</div>
                  <div>{{ user['role'] }}</div>
                  <div>{{ user['phone'] }}</div>
                  <div>
                    <button onclick="editUser('{{ user['id'] }}', '{{ user['name'] }}', '{{ user['role'] }}', '{{ user['phone'] }}')">
                      Edit
                    </button>

                    <button onclick="deleteUser('{{ user['id'] }}')">
                      Delete
                    </button>
                  </div>
                </div>
              </div>
              {% endfor %}

            </div>

          </section>
        </div>
      </div>
    </div>
  </main>
</div>
  
<!-- ===== ADD USER POPUP ===== -->
<div id="popup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); justify-content:center; align-items:center;">
  <div style="background:white; padding:20px; border-radius:10px; width:300px;">

    <h4>Add User</h4>

    <input id="nameInput" placeholder="Name" class="form-control mb-2">
    <input id="emailInput" placeholder="Email" class="form-control mb-2">
    <input id="passwordInput" type="password" placeholder="Password" class="form-control mb-2">
    <input id="phoneInput" placeholder="Phone" class="form-control mb-2">

    <select id="roleInput" class="form-control mb-3">
      <option value="Employee">Employee</option>
      <option value="ShiftLead">Shift Lead</option>
      <option value="Manager">Manager</option>
    </select>

    <button class="btn btn-primary w-100" onclick="addUser()">Add</button>
    <button class="btn btn-secondary w-100 mt-2" onclick="closePopup()">Close</button>

  </div>
</div>

<!-- ===== EDIT POPUP ===== -->
<div id="editPopup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); justify-content:center; align-items:center;">
  <div style="background:white; padding:20px; border-radius:10px; width:300px;">

    <h4>Edit User</h4>

    <input id="editName" class="form-control mb-2">
    <input id="editPhone" class="form-control mb-2">

    <select id="editRole" class="form-control mb-3">
      <option value="Employee">Employee</option>
      <option value="ShiftLead">Shift Lead</option>
      <option value="Manager">Manager</option>
    </select>

    <button class="btn btn-primary w-100" onclick="updateUser()">Update</button>
    <button class="btn btn-secondary w-100 mt-2" onclick="closeEdit()">Close</button>

  </div>
</div>

<!-- ===== JS ===== -->
<script>

let currentEditId = null;

/* ADD */
function openPopup() {
  document.getElementById("popup").style.display = "flex";
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}

function addUser() {
  fetch('/user', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: document.getElementById("nameInput").value,
      email: document.getElementById("emailInput").value,
      password: document.getElementById("passwordInput").value,
      role: document.getElementById("roleInput").value,
      phone: document.getElementById("phoneInput").value
    })
  })
  .then(res => res.json())
  .then(() => location.reload());
}

/* DELETE */
function deleteUser(id) {
  fetch(`/user/${id}`, {
    method: 'DELETE'
  })
  .then(res => res.json())
  .then(() => location.reload());
}

/* EDIT */
function editUser(id, name, role, phone) {
  currentEditId = id;

  document.getElementById("editName").value = name;
  document.getElementById("editRole").value = role;
  document.getElementById("editPhone").value = phone;

  document.getElementById("editPopup").style.display = "flex";
}

function closeEdit() {
  document.getElementById("editPopup").style.display = "none";
}

function updateUser() {
  fetch(`/user/${currentEditId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: document.getElementById("editName").value,
      role: document.getElementById("editRole").value,
      phone: document.getElementById("editPhone").value
    })
  })
  .then(res => res.json())
  .then(() => location.reload());
}
// ================= SEARCH (added for B2) =================
function filterUsers(query) {
  query = query.toLowerCase();

  document.querySelectorAll(".man5-name-1").forEach(row => {
    row.style.display = row.innerText.toLowerCase().includes(query)
      ? "block" : "none";
  });
}
</script>

</body>
</html>
