<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/S2026_TEAM1/manager-dashboard/CSS/style-man-dash.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Create Purchase Order</title>
</head>
<body>
  <div class="container-fluid p-0">
 
    <!-- ══ SIDEBAR (identical structure to man-dash.html) ══ -->
    <nav class="sidebar-wrapper d-flex flex-column justify-content-between align-items-center">

      <div class="w-100">
        <img class="kft-logo" src="kft-logo0.png" alt="Kung Fu Tea Silver Spring logo" />

        <div class="sidebar-nav d-flex flex-column gap-2">
          <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/FULL/MAN-FULL/man-full.html'">Full Inventory View</button>
          <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/audit/MAN-AUDIT-1/man-audit-1.html'">Inventory Reconciliation</button>
          <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/audit/MAN-AUDIT-4/man-audit-4.html'">Activity Log</button>
          <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/manager-dashboard/man-dash.html'">Dashboards & Analytics</button>
          <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/predictive/MAN-PREDICTIVE-7/man-predictive-7.html'">Predictive Reports</button>
          <button class="nav-btn" onclick="window.location.href='/S2026_TEAM1/manage-users/MAN-AUDIT-5/user1.html'">Manage Users</button>
          <button class="nav-btn active two-line">Purchase Order Management</button>
          
      </div>
    </div>

    <div class="pb-4">
      <a href="/S2026_TEAM1/index.html" class="logout-btn">Logout</a>
    </div>

  </nav>

    <!-- ══ MAIN CONTENT ══ -->
    <main class="main-content-area">
      <div class="content-container-centered">
 
        <!-- Heading banner -->
        <div class="rectangle-5 mb-5">
          <h1 class="purchase-order-management">Purchase Order Management</h1>
        </div>
 
        <!-- Form card -->
        <div class="form-card">
           
          <span class="form-close-btn" onclick="cancelOrder()">×</span>

          <h2 class="form-card-title">Create Purchase Order</h2>
 
          <!-- ── Supplier ── -->
          <div>
            <div class="form-section-label">Supplier:</div>
            <div class="supplier-row">
              <select id="supplierSelect" onchange="onSupplierChange()">
                <option value="" selected hidden>Supplier Name</option>
                <option value="Kung Fu Tea HQ">Kung Fu Tea HQ</option>
              </select>
              <button class="btn-supplier" onclick="openSupplierModal('add')">+ Add Supplier</button>
              <button class="btn-supplier" onclick="openSupplierModal('edit')">+ Edit Supplier</button>
            </div>
          </div>
 
          <!-- ── Products ── -->
          <div>
            <div class="products-header">
              <div class="form-section-label" style="margin-bottom:0">Products:</div>
              <button class="btn-add-product" onclick="addProductRow()">+ Add Product</button>
            </div>
 
            <div id="productRowsContainer">
              <!-- Row 1 -->
              <div class="product-row">
                <select class="product-select">
                  <option value="" disabled>Product Name</option>
                  <option selected>Tapioca Balls</option>
                  <option>Black Tea</option><option>Chia Seeds</option>
                  <option>Grass Jelly</option><option>Green Tea</option>
                  <option>Hot Large Cups</option><option>Hot Med. Cups</option>
                  <option>Jasmine Tea</option><option>Large Cups</option>
                  <option>Lychee Jelly</option><option>Mango Bubbles</option>
                  <option>Mango Syrup</option><option>Milk Powder</option>
                  <option>Oolong Tea</option><option>Straws</option>
                  <option>Taro Powder</option><option>Thai Powder</option>
                </select>
                <input type="number" class="product-qty-input" placeholder="Qty" value="64" min="1" />
                <span class="row-delete-btn" onclick="removeProductRow(this)">X</span>
              </div>
              <!-- Row 2 -->
              <div class="product-row">
                <select class="product-select">
                  <option value="" disabled selected>Product Name</option>
                  <option>Black Tea</option><option>Chia Seeds</option>
                  <option>Grass Jelly</option><option>Green Tea</option>
                  <option>Hot Large Cups</option><option>Hot Med. Cups</option>
                  <option>Jasmine Tea</option><option>Large Cups</option>
                  <option>Lychee Jelly</option><option>Mango Bubbles</option>
                  <option>Mango Syrup</option><option>Milk Powder</option>
                  <option>Oolong Tea</option><option>Straws</option>
                  <option>Tapioca Balls</option>
                  <option>Taro Powder</option><option>Thai Powder</option>
                </select>
                <input type="number" class="product-qty-input" placeholder="Qty" min="1" />
                <span class="row-delete-btn" onclick="removeProductRow(this)">X</span>
              </div>
            </div>
          </div>
 
          <!-- ── Timestamp + Expected Date ── -->
          <div class="dates-row">
            <div class="date-field">
              <div class="form-section-label" style="margin-bottom:0">Timestamp:</div>
              <input id="timestampInput" type="date" class="date-input"
                onchange="handleDateChange()" />
            </div>
            <div class="date-field">
              <div class="form-section-label" style="margin-bottom:0">Expected Date:</div>
              <input id="expectedDateInput" type="date" class="date-input"
                onchange="handleExpectedDateChange()" />
            </div>
          </div>
 
          <!-- ── Error + Submit ── -->
          <p class="form-error" id="formError">
            Please fill in all required fields and add at least one product.
          </p>
 
          <div class="submit-row">
            <button class="btn-submit-order" onclick="submitOrder()">Add Purchase Order</button>
          </div>
 
        </div><!-- end .form-card -->
      </div><!-- end .content-container-centered -->
    </main>
 
    <!-- ══ SUPPLIER INFORMATION MODAL ══ -->
    <div id="supplierModalWrapper">
      <div id="supplierModalOverlay" onclick="closeSupplierModal()"></div>
 
      <div class="supplier-modal-card">
        <span class="supplier-modal-close" onclick="closeSupplierModal()">x</span>
        <h3 class="supplier-modal-title">Supplier Information</h3>
 
        <div class="supplier-modal-field">
          <label for="inputSupplierName">Supplier Name</label>
          <input id="inputSupplierName" type="text" placeholder="Type here…" />
          <span id="supplierNameError">Name is required.</span>
        </div>
 
        <div class="supplier-modal-field">
          <label for="inputSupplierAddress">Supplier Address</label>
          <input id="inputSupplierAddress" type="text" placeholder="Type here…" />
        </div>
 
        <div class="supplier-modal-actions">
          <button class="supplier-modal-cancel" onclick="closeSupplierModal()">Cancel</button>
          <button class="btn-supplier-submit" id="supplierSubmitBtn" onclick="confirmSupplier()">
            <span id="supplierSubmitLabel">Add Supplier</span>
          </button>
        </div>
      </div>
    </div>
 
  </div><!-- end .container-fluid -->
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    
    function cancelOrder() {
      window.location.href = "purchase_order_info.html";
    }
    
    function onSupplierChange() {
      /* Nothing visual to toggle — native select shows the chosen value */
    }
 
    function handleDateChange() {
      /* Native date input shows value natively — no placeholder toggling needed */
    }
 
    function handleExpectedDateChange() {
      /* Native date input shows value natively — no placeholder toggling needed */
    }
 
    /* ── Product rows ── */
    const PRODUCTS = [
      'Black Tea','Chia Seeds','Grass Jelly','Green Tea',
      'Hot Large Cups','Hot Med. Cups','Jasmine Tea','Large Cups',
      'Lychee Jelly','Mango Bubbles','Mango Syrup','Milk Powder',
      'Oolong Tea','Straws','Tapioca Balls','Taro Powder','Thai Powder'
    ];
 
    function buildProductOptions(selected = '') {
      return `<option value="" disabled ${selected ? '' : 'selected'}>Product Name</option>`
        + PRODUCTS.map(p => `<option ${p === selected ? 'selected' : ''}>${p}</option>`).join('');
    }
 
    function addProductRow() {
      const c   = document.getElementById('productRowsContainer');
      const row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML = `
        <select class="product-select">${buildProductOptions()}</select>
        <input type="number" class="product-qty-input" placeholder="Qty" min="1" />
        <span class="row-delete-btn" onclick="removeProductRow(this)">X</span>`;
      c.appendChild(row);
      c.scrollTop = c.scrollHeight;
    }
 
    function removeProductRow(btn) { btn.closest('.product-row')?.remove(); }
 
    /* ── Supplier modal ── */
    let modalMode    = 'add';
    let editingValue = null;
 
    function openSupplierModal(mode) {
      modalMode    = mode;
      editingValue = null;
 
      const nameEl = document.getElementById('inputSupplierName');
      const addrEl = document.getElementById('inputSupplierAddress');
      const errEl  = document.getElementById('supplierNameError');
      const label  = document.getElementById('supplierSubmitLabel');
      const sel    = document.getElementById('supplierSelect');
      const curVal = sel.value;
 
      errEl.style.display = 'none';
      nameEl.classList.remove('input-error');
 
      if (mode === 'edit' && curVal) {
        const opt    = [...sel.options].find(o => o.value === curVal);
        nameEl.value = opt ? opt.textContent.trim() : curVal;
        addrEl.value = opt?.dataset.address || '';
        editingValue = curVal;
        label.textContent = 'Save Changes';
      } else {
        nameEl.value = '';
        addrEl.value = '';
        label.textContent = 'Add Supplier';
        if (mode === 'edit') modalMode = 'add';
      }
 
      document.getElementById('supplierModalWrapper').classList.add('modal-visible');
      nameEl.focus();
    }
 
    function closeSupplierModal() {
      document.getElementById('supplierModalWrapper').classList.remove('modal-visible');
    }
 
    function confirmSupplier() {
      const nameEl  = document.getElementById('inputSupplierName');
      const addrEl  = document.getElementById('inputSupplierAddress');
      const errEl   = document.getElementById('supplierNameError');
      const name    = nameEl.value.trim();
      const address = addrEl.value.trim();
 
      if (!name) {
        errEl.style.display = 'block';
        nameEl.classList.add('input-error');
        nameEl.focus();
        return;
      }
      errEl.style.display = 'none';
      nameEl.classList.remove('input-error');
 
      const sel = document.getElementById('supplierSelect');
 
      if (modalMode === 'edit' && editingValue) {
        const opt = [...sel.options].find(o => o.value === editingValue);
        if (opt) {
          opt.value = opt.textContent = name;
          opt.dataset.address = address;
          sel.value = name;
        } else {
          _addOption(sel, name, address);
        }
      } else {
        _addOption(sel, name, address);
      }
 
      closeSupplierModal();
    }
 
    function _addOption(sel, name, address) {
      const opt = document.createElement('option');
      opt.value = opt.textContent = name;
      opt.dataset.address = address;
      sel.appendChild(opt);
      sel.value = name;
    }
 
    /* ── Submit order ── */
    function submitOrder() {
      const errEl    = document.getElementById('formError');
      const supplier = document.getElementById('supplierSelect').value;
      const timestamp = document.getElementById('timestampInput').value;
 
      const products = [];
      document.querySelectorAll('.product-row').forEach(row => {
        const n = row.querySelector('.product-select')?.value?.trim() || '';
        const q = row.querySelector('.product-qty-input')?.value?.trim() || '';
        if (n || q) products.push({ name: n, qty: q });
      });
 
      let ok = true;
      const supEl  = document.getElementById('supplierSelect');
      const dateEl = document.getElementById('timestampInput');
      if (!supplier)      { supEl.classList.add('input-error');  ok = false; }
      else                { supEl.classList.remove('input-error'); }
      if (!timestamp)     { dateEl.classList.add('input-error'); ok = false; }
      else                { dateEl.classList.remove('input-error'); }
      if (!products.length) ok = false;
 
      if (!ok) { errEl.classList.add('visible'); return; }
      errEl.classList.remove('visible');
 
      const existing     = JSON.parse(sessionStorage.getItem('newOrders') || '[]');
      const newId        = 'po' + (4 + existing.length + 1);
      const expectedDate = document.getElementById('expectedDateInput').value;
      existing.push({ id: newId, supplier, date: timestamp, expectedDate, products, status: 'Pending' });
      sessionStorage.setItem('newOrders', JSON.stringify(existing));
      window.location.href = 'purchase_order_info.html';
    }
 
  </script>
</body>
</html>
