<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- TEAM STYLES -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style-man-dash.css') }}">
  <!-- MY STYLES -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <title>Manage Users</title>
</head>

<body>

<div class="container-fluid p-0">

  <!-- SIDEBAR -->
  <nav class="sidebar-wrapper d-flex flex-column justify-content-between align-items-center">
    <div class="w-100">
      <img class="kft-logo"
        src="{{ url_for('static', filename='images/kft-logo0.png') }}"
        alt="Kung Fu Tea logo"
      />

      <div class="sidebar-nav d-flex flex-column gap-2">
        <button class="nav-btn">Full Inventory View</button>
        <button class="nav-btn">Inventory Reconciliation</button>
        <button class="nav-btn">Activity Log</button>
        <button class="nav-btn">Dashboards & Analytics</button>
        <button class="nav-btn">Predictive Reports</button>
        <button class="nav-btn active">Manage Users</button>
        <button class="nav-btn two-line">Purchase Order<br>Management</button>
      </div>
    </div>

    <div class="pb-4">
      <a href="#" class="logout-btn">Logout</a>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="col main-content-area">
    <div class="content-container-centered">

      <!-- HEADER -->
      <div class="rectangle-5 mb-5">
        <h1 class="man5-manage-users">Manage Users</h1>
      </div>

      <!-- CARD -->
      <div class="row justify-content-center">
        <div class="col-lg-10">

          <section class="man5-main-rectangle">

            <div class="man5-manage-users-topbar">
              <h2 class="man5-manage-users2">Manage Users</h2>

              <button id="openPopup"
                class="man5-add-new-user-rectangle man5-add-new-user">
                + Add New User
              </button>
            </div>

            <!-- SEARCH -->
            <div class="man5-search-row">
              <div class="man5-search-box2">
                <span>⌕</span>
                <input type="text" placeholder="Name" />
              </div>
            </div>

            <!-- TABLE -->
            <div class="man5-inner-rec">

              <!-- HEADER -->
              <div class="man5-status-box">
                <div class="man5-frame-2">
                  <div>Name</div>
                  <div>Role</div>
                  <div>Phone</div>
                  <div>Status</div>
                </div>
              </div>

              <!-- ✅ DYNAMIC USERS -->
              {% for user in users %}
              <div class="man5-name-1">
                <div class="man5-frame-2">
                  <div>{{ user[0] }}</div>
                  <div>{{ user[1] }}</div>
                  <div>{{ user[2] }}</div>
                  <div>Active</div>
                </div>
              </div>
              {% endfor %}

            </div>
          </section>

        </div>
      </div>

    </div>
  </main>
</div>

<!-- POPUP -->
<div id="man5-popupForm" style="display:none;">
  <div class="man5-popup-box">
    <div id="man5-closePopup">✕</div>

    <h4>Add New User</h4>

    <label>Full Name</label>
    <input id="nameInput" type="text" placeholder="First, Last Initial"/>

    <label>Phone</label>
    <input id="phoneInput" type="text" placeholder="XXXXXXXXXX"/>

    <label>Role</label>
    <select id="roleInput">
      <option>Employee</option>
      <option>ShiftLead</option>
      <option>Manager</option>
    </select>

    <button id="addUser">Add User</button>
  </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function() {

  // OPEN POPUP
  $("#openPopup").click(function() {
    $("#man5-popupForm").css("display", "flex");
  });

  // CLOSE POPUP
  $("#man5-closePopup").click(function() {
    $("#man5-popupForm").hide();
  });

  // ADD USER
  $("#addUser").click(function() {
    const name = $("#nameInput").val();
    const role = $("#roleInput").val();
    const phone = $("#phoneInput").val();

    if (!name || !phone) {
      alert("Please fill all fields");
      return;
    }

    $.ajax({
      url: '/user',
      type: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({
        name: name,
        role: role,
        phone: phone
      }),
      success: function() {
        alert("User added!");
        location.reload();
      },
      error: function(err) {
        console.log(err);
        alert("Error adding user");
      }
    });
  });

});
// SEARCH FILTER
$("input[placeholder='Name']").on("keyup", function() {
  let value = $(this).val().toLowerCase();

  $(".man5-name-1").filter(function() {
    $(this).toggle(
      $(this).text().toLowerCase().includes(value)
    );
  });
});
</script>

</body>
</html>
