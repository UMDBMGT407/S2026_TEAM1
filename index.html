<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/S2026_TEAM1/vars.css">
<link rel="stylesheet" href="/S2026_TEAM1/audit/CSS/style-log.css">

  <style>
    a,
    button,
    input,
    select,
    h1,
    h2,
    h3,
    h4,
    h5,
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      text-decoration: none;
      background: none;
      -webkit-font-smoothing: antialiased;
    }

    menu, ol, ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
  </style>

  <title>Login</title>
</head>
<body>
  <div
    class="login-page"
    style="
      background: url(/S2026_TEAM1/audit/LOGIN/login-page.png) center;
      background-size: cover;
      background-repeat: no-repeat;
    "
  >
    <div class="frame-1">
      <div class="welcome-to-kung-fu-tea-silver-spring-inventory-management-system">
        WELCOME TO KUNG FU TEA SILVER SPRING INVENTORY MANAGEMENT SYSTEM
      </div>
    </div>

    <img class="kft-quality-image-1" src="audit/LOGIN/kft-quality-image-10.png" alt="Kung Fu Tea drinks" />
    <img class="rectangle-1" src="audit/LOGIN/rectangle-10.svg" alt="" />

    <div class="new-member-contact-your-manager-to-set-up-an-account">
      <span>
        <span class="new-member-contact-your-manager-to-set-up-an-account-span">
          Forgot password? New member?
        </span>
        <span class="new-member-contact-your-manager-to-set-up-an-account-span2">
          <br />
          Contact your manager to set up an account.
        </span>
      </span>
    </div>

    <div class="login-user">LOGIN USER</div>

    <form class="login-form" onsubmit="handleLogin(event)">
      <input
        class="login-input id-input"
        type="text"
        id="userId"
        placeholder="Enter your ID"
        aria-label="Enter your ID"
      />

      <input
        class="login-input password-input"
        type="password"
        id="userPassword"
        placeholder="Enter your password"
        aria-label="Enter your password"
      />

      <button type="submit" class="login-btn">Login</button>
    </form>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();

      const userId = document.getElementById("userId").value.trim();
      const password = document.getElementById("userPassword").value.trim();

   if (userId === "MANAGER" && password === "manager") {
  window.location.href = "audit/MAN-AUDIT-1/man-audit-1.html";
} 
else if (userId === "SHIFTLEAD" && password === "shiftlead") {
  window.location.href = "audit/SL-AUDIT-1/sl-audit-1.html";
} 
  else if (userId === "EMPLOYEE" && password === "employee") {
  window.location.href = "FULL/employee/emp-full-inv.html";
} 
else {
  alert("Invalid ID or password.");
}
    }
  </script>
</body>
</html>
