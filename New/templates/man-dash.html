<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  
  <div class="container-fluid p-0">

    <!-- ✅ UPDATED NAVBAR ONLY -->
    <nav class="sidebar-wrapper">

      <div>
        <div class="logo">
          Kung Fu Tea<br>Manager Portal
        </div>

        <div class="sidebar-nav">

          <div class="nav-section-title">OVERVIEW</div>
          <a class="nav-btn" href="{{ url_for('firstdash') }}">Dashboard</a>

          <div class="nav-section-title">INVENTORY</div>
          <a class="nav-btn" href="{{ url_for('inventory') }}">View Inventory</a>
          <a class="nav-btn" href="{{ url_for('man_audit_1') }}">Run Inventory Audit</a>
          <a class="nav-btn" href="{{ url_for('man_audit_4') }}">Inventory History</a>

          <div class="nav-section-title">ORDERS</div>
          <a class="nav-btn" href="{{ url_for('purchaseOrders') }}">Purchase Orders</a>
          <a class="nav-btn" href="{{ url_for('delivery_audit_list') }}">Delivery Audit</a>

          <div class="nav-section-title">INSIGHTS</div>
          <a class="nav-btn active" href="{{ url_for('dashboard') }}">Analytics</a>
          <a class="nav-btn" href="{{ url_for('predictive_reports') }}">Stock Forecast</a>

          <div class="nav-section-title">ADMIN</div>
          <a class="nav-btn" href="{{ url_for('manage_users') }}">Manage Users</a>

        </div>
      </div>

      <div class="sidebar-bottom">
        <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
      </div>

    </nav>

    <!-- MAIN (UNCHANGED) -->
    <main class="col main-content-area">
      <div class="content-container-centered">

        <!-- Page Heading -->
        <div class="header-container mb-4">
            <h1 class="page-heading">Analytics</h1>
        </div>

        <div class="d-flex justify-content-center gap-2 mb-4">
          <button class="fd-btn fd-btn-secondary toggle-view-btn compact-btn active-toggle" id="viewBtnUsage" onclick="switchView('usage')">
              Inventory
          </button>
          <button class="fd-btn fd-btn-secondary toggle-view-btn compact-btn" id="viewBtnAudit" onclick="switchView('audit')">
              Audits
          </button>
        </div>

        <div class="dashboard-card p-3">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h2 class="usage-trends-title" id="mainChartTitle" style="font-size: 24px;">Inventory Activity</h2>
                
                <div class="d-flex align-items-center gap-2">
                    <input type="date" id="filterStart" class="filter-select compact-select" onchange="applyFilters()">
                    <span style="color: #964f4c; font-weight: bold; font-size: 14px;">to</span>
                    <input type="date" id="filterEnd" class="filter-select compact-select" onchange="applyFilters()">
                    
                    <select id="filterCategory" class="filter-select compact-select" onchange="applyFilters()">
                        <option value="all">All Categories</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div style="height: 320px; width: 100%; background: #fcefe4; border-radius: 12px; padding: 10px;">
              <canvas id="analyticsChart"></canvas>
            </div>
        </div>

      </div>
    </main>
    
  </div>

  <script>

    let myChart;
    let globalData = {};
    let currentMode = 'usage'; 

    document.addEventListener("DOMContentLoaded", function() {
        // Set default dates
        const end = new Date();
        const start = new Date();
        start.setDate(end.getDate() - 6);

        document.getElementById('filterEnd').value = end.toISOString().split('T')[0];
        document.getElementById('filterStart').value = start.toISOString().split('T')[0];

        initChart();
    });

    async function initChart() {
        const start = document.getElementById("filterStart").value;
        const end = document.getElementById("filterEnd").value;
        const cat = document.getElementById("filterCategory").value;

        try {
            // Fetch from your updated app.py route
            const response = await fetch(`/api/analytics-data?start=${start}&end=${end}&category=${cat}`);
            globalData = await response.json();

            const ctx = document.getElementById('analyticsChart').getContext('2d');
            
            // Destroy existing chart if it exists to prevent overlap
            if (myChart) { myChart.destroy(); }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: globalData.labels,
                    datasets: [{
                        label: 'Units Used',
                        data: globalData.usage,
                        borderColor: '#964f4c', // Maroon
                        backgroundColor: 'rgba(150, 79, 76, 0.1)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // Allows the 320px height to take effect
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { 
                            beginAtZero: true,
                            ticks: { font: { size: 11 } } // Smaller font for flatter layout
                        }
                    }
                }
            });
        } catch (err) {
            console.error("Fetch failed:", err);
        }
    }

    

    // Updated function to handle the entire page transition
    function switchView(mode) {
        currentMode = mode;
        const isUsage = (mode === 'usage');
        
        // 1. Fix the Heading
        document.getElementById('mainChartTitle').innerText = isUsage ? 
            'Inventory Activity' : 'Audit Discrepancies';

        // 2. Darken the Active Button
        document.getElementById('viewBtnUsage').classList.toggle('active-toggle', isUsage);
        document.getElementById('viewBtnAudit').classList.toggle('active-toggle', !isUsage);

        // 3. Update the Graph
        if (myChart && globalData.labels) {
            myChart.data.datasets[0].data = isUsage ? globalData.usage : globalData.audit;
            myChart.data.datasets[0].label = isUsage ? 'Units Used' : 'Discrepancy Count';
            myChart.data.datasets[0].borderColor = isUsage ? '#964f4c' : '#c07a00';
            myChart.update();
        }
    }

    // Ensure the filters still work with the new global switch
    async function applyFilters() {
        const start = document.getElementById("filterStart").value;
        const end = document.getElementById("filterEnd").value;
        const cat = document.getElementById("filterCategory").value;

        const response = await fetch(`/api/analytics-data?start=${start}&end=${end}&category=${cat}`);
        globalData = await response.json();

        if (myChart) {
            myChart.data.labels = globalData.labels;
            switchView(currentMode); // Refreshes visuals and data
        }
    }


  </script>
</body>
</html>
